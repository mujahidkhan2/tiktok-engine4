<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Brain - Command Center</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #111; padding: 20px; text-align: center; border-bottom: 2px solid #00ff00; font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 5px; box-shadow: 0 0 15px #00ff00; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 10px; line-height: 1.5; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #004400; color: #fff; border: 1px solid #00ff00; }
        .brain-msg { align-self: flex-start; background: #1a1a1a; color: #00ff00; border: 1px solid #00ff00; }
        .input-area { background: #111; padding: 20px; display: flex; gap: 10px; border-top: 2px solid #00ff00; }
        input { background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 15px; font-size: 16px; outline: none; }
        button { background: #00ff00; color: #000; border: none; padding: 0 25px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #00cc00; box-shadow: 0 0 10px #00ff00; }
    </style>
</head>
<body>
    <div class="header">🧠 THE BRAIN - CORE COMMANDS 🧠</div>
    <div id="chat-container">
        <div class="msg brain-msg">System Online. Waiting for Owner's Secret Key and Command...</div>
    </div>
    <div class="input-area">
        <input type="text" id="userKey" placeholder="Enter Secret Key..." style="flex: 0.3;">
        <input type="text" id="userCmd" placeholder="Type your command here..." onkeypress="if(event.keyCode==13) sendCommand()">
        <button onclick="sendCommand()">Execute</button>
    </div>

    <script>
        async function sendCommand() {
            const key = document.getElementById('userKey').value;
            const cmd = document.getElementById('userCmd').value;
            if(!key || !cmd) {
                alert("Key and Command are required!");
                return;
            }

            appendMsg('User', cmd, 'user-msg');
            document.getElementById('userCmd').value = '';

            try {
                const response = await fetch('/brain/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key: key, command: cmd})
                });
                const data = await response.json();
                appendMsg('Brain', data.response, 'brain-msg');
            } catch (e) {
                appendMsg('System', 'Error connecting to The Brain. Server might be offline.', 'brain-msg');
            }
        }

        function appendMsg(sender, text, className) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'msg ' + className;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
