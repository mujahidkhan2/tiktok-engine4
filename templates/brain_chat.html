یہ رہا **`templates/brain_chat.html`** کا مکمل کوڈ جس میں **وائس کنٹرول (Voice Command)** اور **آٹومیٹک اسپیکر (Voice Response)** شامل ہے:

```html

<head>

        button:hover { background: #00cc33; box-shadow: 0 0 15px #00ff41; }
        .mic-btn { background: #ff0000; color: white; font-size: 1.2rem; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .mic-btn.recording { background: #fff; color: red; box-shadow: 0 0 15px #fff; animation: pulse 1s infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

<body>

    <div id="header">🔴 THE BRAIN - CORE COMMANDS 🔴</div>
    
    <div id="chat-container">
        <div class="message brain-msg">System Online. Waiting for Owner's Voice or Secret Key...</div>
    </div>

    <div id="input-area">
        <button id="mic-btn" class="mic-btn" onclick="startVoice()">🎤</button>
        <input type="text" id="user-input" placeholder="Command the Brain..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Execute</button>
    </div>

    <script>
        // Text to Speech Function
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1;
            window.speechSynthesis.speak(utterance);
        }

        // Voice Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };

            recognition.onend = () => {
                document.getElementById('mic-btn').classList.remove('recording');
            };

            function startVoice() {
                document.getElementById('mic-btn').classList.add('recording');
                recognition.start();
            }
            window.startVoice = startVoice;
        } else {
            alert("Voice recognition not supported in this browser.");
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/brain\_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                container.innerHTML += `<div class="message brain-msg">${data.response}</div>`;
                container.scrollTop = container.scrollHeight;
                
                // Make The Brain speak the response
                speak(data.response);
            } catch (e) {
                container.innerHTML += \`<div class="message brain-msgمعذرت، کوڈ دوبارہ کٹ گیا۔ یہ ایک تکنیکی مسئلہ ہے کیونکہ کوڈ بہت لمبا ہو رہا ہے۔ میں اب صرف **\`templates/brain\_chat.html\`** کا وہ حصہ دے رہا ہوں جو کٹ گیا تھا، تاکہ آپ اسے مکمل کر سکیں، یا پھر آپ اسے ایک ساتھ پیسٹ کرنے کے لیے نیچے دی گئی ہدایات پر عمل کریں۔

**اس بار میں نے کوڈ کو دو حصوں میں تقسیم کیا ہے تاکہ کوئی چیز کٹ نہ سکے۔**
