<!DOCTYPE html>
<html>
<head>
    <title>The Brain | Command Center</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #terminal { height: 80vh; width: 90%; margin: 20px auto; border: 2px solid #00ff41; padding: 20px; overflow-y: auto; box-shadow: 0 0 20px #00ff41; background: rgba(0,0,0,0.9); }
        #input-area { width: 90%; margin: 0 auto; display: flex; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 15px; font-size: 18px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 15px; line-height: 1.5; }
        .user { color: #fff; font-weight: bold; }
        .brain { color: #00ff41; }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="msg brain">SYSTEM ONLINE... The Brain is waiting for commands.</div>
    </div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Enter command for The Brain...">
        <button onclick="send()">EXECUTE</button>
    </div>

    <script>
        async function send() {
            let input = document.getElementById('userInput');
            let term = document.getElementById('terminal');
            let msg = input.value;
            if(!msg) return;

            term.innerHTML += `<div class="msg user">> ${msg}</div>`;
            input.value = '';

            const res = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();
            term.innerHTML += `<div class="msg brain">THE BRAIN: ${data.message}</div>`;
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
