<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BRAIN | Apex Command Center</title>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; border: 3px solid #00ff41; box-sizing: border-box; overflow: hidden; }
        #header { background: #000; padding: 20px; text-align: center; font-size: 1.8rem; border-bottom: 2px solid #00ff41; text-shadow: 0 0 15px #00ff41; letter-spacing: 3px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle, #0a1a0a 0%, #000 100%); }
        .message { max-width: 80%; padding: 15px; border-radius: 10px; animation: slideIn 0.3s ease-out; line-height: 1.5; }
        .brain-msg { align-self: flex-start; background: rgba(0, 255, 65, 0.1); border: 1px solid #00ff41; color: #00ff41; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        .user-msg { align-self: flex-end; background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; text-align: right; }
        #input-area { padding: 20px; background: #000; border-top: 2px solid #00ff41; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 15px; font-family: 'Courier New', monospace; outline: none; font-size: 1rem; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 25px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #00cc33; box-shadow: 0 0 15px #00ff41; }
        #voice-btn { background: #ff0000; color: #fff; border-radius: 50%; width: 60px; height: 60px; cursor: pointer; border: 2px solid #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        #voice-btn.recording { animation: pulse 1s infinite; box-shadow: 0 0 20px #ff0000; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ff41; }
    </style>
</head>
<body>
    <div id="header">🔴 THE BRAIN - APEX CONTROL 🔴</div>
    <div id="chat-container">
        <div class="message brain-msg">System Ready. Voice Recognition Active. I am waiting for your command, Owner.</div>
    </div>
    <div id="input-area">
        <button id="voice-btn" onclick="startVoice()">🎤</button>
        <input type="text" id="user-input" placeholder="Speak or type command..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Execute</button>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        const synth = window.speechSynthesis;

        if (recognition) {
            recognition.lang = 'en-US'; 
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };
            recognition.onend = () => { document.getElementById('voice-btn').classList.remove('recording'); };
        }

        function startVoice() {
            if (!recognition) return alert("Voice not supported in this browser");
            document.getElementById('voice-btn').classList.add('recording');
            recognition.start();
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            synth.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/brain_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                container.innerHTML += `<div class="message brain-msg">${data.response}</div>`;
                container.scrollTop = container.scrollHeight;
                speak(data.response);
            } catch (e) {
                container.innerHTML += `<div class="message brain-msg" style="color: red;">Error: Brain is unresponsive.</div>`;
            }
        }
    </script>
</body>
</html>
