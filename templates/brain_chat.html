<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>The Brain | Command Center</title>
    <style>
        body {
            background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 65, 0.3); border-radius: 20px;
            width: 80%; height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); overflow: hidden;
        }
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px; font-size: 18px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; }
        .user-msg { background: rgba(0, 255, 65, 0.1); align-self: flex-end; text-align: right; }
        .brain-msg { background: rgba(255, 255, 255, 0.05); align-self: flex-start; border-left: 3px solid #00ff41; }
        .controls {
            padding: 20px; background: rgba(0, 0, 0, 0.5); display: flex; gap: 10px; align-items: center;
        }
        input {
            flex: 1; background: transparent; border: 1px solid #00ff41;
            color: #00ff41; padding: 10px; border-radius: 5px; outline: none;
        }
        button {
            background: #00ff41; color: #000; border: none; padding: 10px 20px;
            cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s;
        }
        button:hover { background: #00cc33; box-shadow: 0 0 10px #00ff41; }
        .speed-btn { background: #333; color: #00ff41; border: 1px solid #00ff41; }
    </style>
</head>
<body>

<div class="glass-panel">
    <div id="chat-window">
        <div class="msg brain-msg">🫡 منشی حاضر ہے، مالک۔ حکم کریں!</div>
    </div>
    <div class="controls">
        <button class="speed-btn" onclick="changeSpeed('slow')">🐢</button>
        <button class="speed-btn" onclick="changeSpeed('fast')">🚀</button>
        <input type="text" id="userInput" placeholder="کچھ لکھیں یا بولیں...">
        <button onclick="startVoice()">🎤</button>
        <button onclick="sendMessage()">بھیجیں</button>
    </div>
</div>

<script>
    const MASTER_KEY = "MASTER_123_SECRET";

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat-window');
        if(!input.value) return;

        chat.innerHTML += `<div class="msg user-msg">${input.value}</div>`;
        const text = input.value;
        input.value = '';

        const response = await fetch('/brain/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
            body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        chat.innerHTML += `<div class="msg brain-msg">${data.response}</div>`;
        chat.scrollTop = chat.scrollHeight;
        
        // Text-to-Speech
        const speech = new SpeechSynthesisUtterance(data.response);
        speech.lang = 'ur-PK';
        window.speechSynthesis.speak(speech);
    }

    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ur-PK';
        recognition.start();
        recognition.onresult = (event) => {
            document.getElementById('userInput').value = event.results[0][0].transcript;
            sendMessage();
        };
    }

    function changeSpeed(mode) {
        alert("Speed set to: " + mode);
        // This will be linked to BrainCore logic via sendMessage
    }
</script>
</body>
</html>
