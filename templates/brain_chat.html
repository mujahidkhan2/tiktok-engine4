<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Brain | Intelligence Center</title>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --chat-bg: #ffffff;
            --user-msg: #e1f5fe;
            --brain-msg: #ffffff;
            --accent-color: #007aff;
            --text-main: #333;
            --text-muted: #666;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* Header */
        .header {
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-main);
            border-bottom: 1px solid #ddd;
            background: #fff;
        }

        /* Chat Area */
        #terminal { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
        }

        .msg { 
            max-width: 80%; 
            padding: 12px 16px; 
            border-radius: 15px; 
            font-size: 15px; 
            line-height: 1.5; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .user { 
            align-self: flex-end; 
            background-color: var(--accent-color); 
            color: white; 
            border-bottom-right-radius: 2px; 
        }

        .brain { 
            align-self: flex-start; 
            background-color: var(--brain-msg); 
            color: var(--text-main); 
            border-bottom-left-radius: 2px; 
            border: 1px solid #eee;
        }

        /* Input Area */
        .input-container { 
            padding: 20px; 
            background: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-top: 1px solid #ddd;
        }

        .input-box { 
            display: flex; 
            align-items: center; 
            background: #f0f2f5; 
            border-radius: 25px; 
            padding: 5px 15px; 
            width: 100%; 
            max-width: 800px; 
            transition: 0.3s;
        }

        .input-box:focus-within {
            background: #e8eaed;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        input { 
            flex: 1; 
            border: none; 
            background: transparent; 
            padding: 12px; 
            font-size: 16px; 
            outline: none; 
            color: var(--text-main);
        }

        button { 
            background: var(--accent-color); 
            color: white; 
            border: none; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s;
        }

        button:hover { transform: scale(1.1); background: #005bb5; }

        /* Arrow Icon */
        .arrow {
            border: solid white;
            border-width: 0 3px 3px 0;
            display: inline-block;
            padding: 3px;
            transform: rotate(-45deg);
            -webkit-transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="header">THE BRAIN | Intelligence Center</div>
    <div id="terminal">
        <div class="msg brain">Hello. I am The Brain. I have full access to your system. How can I assist you today?</div>
    </div>
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Type a command..." onkeypress="handleKeyPress(event)">
            <button onclick="send()">
                <i class="arrow"></i>
            </button>
        </div>
    </div>

    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') send();
        }

        async function send() {
            let input = document.getElementById('userInput');
            let term = document.getElementById('terminal');
            let msg = input.value.trim();
            if(!msg) return;

            term.innerHTML += `<div class="msg user">${msg}</div>`;
            input.value = '';
            term.scrollTop = term.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                term.innerHTML += `<div class="msg brain">${data.message}</div>`;
            } catch (e) {
                term.innerHTML += `<div class="msg brain" style="color:red">Error: System connection lost.</div>`;
            }
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
