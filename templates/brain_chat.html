<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>The Brain | Command Center</title>
    <style>
        :root { --neon: #00ff41; --dark: #0a0a0a; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--dark); color: var(--neon); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* Side Navigation Menu */
        .sidebar { 
            width: 260px; background: rgba(0, 0, 0, 0.8); border-right: 1px solid var(--neon); 
            display: flex; flex-direction: column; padding: 20px; gap: 20px;
        }
        .sidebar h2 { font-size: 20px; text-align: center; text-shadow: 0 0 10px var(--neon); }
        .menu-item { 
            padding: 12px; border: 1px solid transparent; cursor: pointer; 
            transition: 0.3s; border-radius: 8px; font-size: 16px;
        }
        .menu-item:hover { background: var(--glass); border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }

        /* Main Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-window { 
            flex: 1; overflow-y: auto; padding: 30px; 
            display: flex; flex-direction: column; gap: 15px; 
        }
        .msg { padding: 15px; border-radius: 15px; max-width: 70%; line-height: 1.6; font-size: 18px; }
        .user-msg { background: rgba(0, 255, 65, 0.1); align-self: flex-end; text-align: right; border: 1px solid var(--neon); }
        .brain-msg { background: var(--glass); align-self: flex-start; border-left: 4px solid var(--neon); }

        /* Control Bar */
        .controls { 
            padding: 20px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--neon);
            display: flex; gap: 15px; align-items: center; 
        }
        input { 
            flex: 1; background: transparent; border: 1px solid var(--neon); 
            color: var(--neon); padding: 12px; border-radius: 10px; outline: none; font-size: 16px;
        }
        button { 
            background: var(--neon); color: #000; border: none; padding: 12px 25px; 
            cursor: pointer; font-weight: bold; border-radius: 10px; transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 15px var(--neon); transform: scale(1.05); }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>🧠 THE BRAIN</h2>
    <div class="menu-item" onclick="sendPreset('سسٹم کی صحت چیک کرو')">🛠️ Project Health</div>
    <div class="menu-item" onclick="sendPreset('خود کو اپ گریڈ کرو')">🚀 Self-Evolution</div>
    <div class="menu-item" onclick="sendPreset('تمام فائلیں اینالائز کرو')">📂 File Analyzer</div>
    <div class="menu-item" onclick="sendPreset('سیکیورٹی رپورٹ دو')">🛡️ Security Hub</div>
    <div style="margin-top: auto; font-size: 12px; opacity: 0.5; text-align: center;">Status: Online | Level 1</div>
</div>

<div class="main-content">
    <div id="chat-window">
        <div class="msg brain-msg">🫡 میں آپ کا منشی ہوں، مالک۔ اب میں صرف جواب نہیں دیتا، بلکہ آپ کے حکم پر خود کو بدل بھی سکتا ہوں۔ حکم فرمائیں!</div>
    </div>
    <div class="controls">
        <button onclick="startVoice()">🎤</button>
        <input type="text" id="userInput" placeholder="اپنا حکم یہاں لکھیں...">
        <button onclick="sendMessage()">بھیجیں</button>
    </div>
</div>

<script>
    const MASTER_KEY = "MASTER_123_SECRET";

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat-window');
        if(!input.value) return;

        const text = input.value;
        chat.innerHTML += `<div class="msg user-msg">${text}</div>`;
        input.value = '';

        try {
            const response = await fetch('/brain/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            chat.innerHTML += `<div class="msg brain-msg">${data.response}</div>`;
        } catch (e) {
            chat.innerHTML += `<div class="msg brain-msg">⚠️ کنکشن میں مسئلہ ہے، لیکن میں زندہ ہوں!</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
        
        const speech = new SpeechSynthesisUtterance(data.response || "مسئلہ ہوا");
        speech.lang = 'ur-PK';
        window.speechSynthesis.speak(speech);
    }

    function sendPreset(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ur-PK';
        recognition.start();
        recognition.onresult = (event) => {
            document.getElementById('userInput').value = event.results[0][0].transcript;
            sendMessage();
        };
    }
</script>
</body>
</html>
