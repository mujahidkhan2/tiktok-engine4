<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BRAIN | Command Center</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            border: 2px solid #00ff41;
            box-sizing: border-box;
            box-shadow: inset 0 0 20px #00ff41;
        }

        #header {
            background: #000;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 2px solid #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .message {
            max-width: 80%;
            padding: 12px;
            border-radius: 5px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        .brain-msg {
            align-self: flex-start;
            background: rgba(0, 255, 65, 0.1);
            border-left: 4px solid #00ff41;
            color: #00ff41;
        }

        .user-msg {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            border-right: 4px solid #fff;
            color: #fff;
            text-align: right;
        }

        #input-area {
            padding: 20px;
            background: #000;
            border-top: 2px solid #00ff41;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 12px;
            font-family: 'Courier New', monospace;
            outline: none;
            box-shadow: inset 0 0 5px #00ff41;
        }

        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background: #00cc33;
            box-shadow: 0 0 15px #00ff41;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ff41; }
    </style>
</head>
<body>

    <div id="header">🔴 THE BRAIN - CORE COMMANDS 🔴</div>
    
    <div id="chat-container">
        <div class="message brain-msg">System Online. Waiting for Owner's Secret Key and Commands...</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Enter Master Key or Command..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Execute</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            // User Message
            container.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/brain_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                // Brain Message
                container.innerHTML += `<div class="message brain-msg">${data.response}</div>`;
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                container.innerHTML += `<div class="message brain-msg" style="color: red;">Error: Connection lost to The Brain.</div>`;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
